[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-a2a-psc-vpcsc"
version = "0.1.0"
description = "Reference implementation and E2E test suite for connecting Custom MCP (BYO-MCP) and A2A Agents to Gemini Enterprise with PSC and VPC-SC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "PyJWT>=2.8.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
