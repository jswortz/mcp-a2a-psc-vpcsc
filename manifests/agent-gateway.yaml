# AgentGateway (networkservices.googleapis.com)
# Governs outbound MCP and A2A traffic from Gemini Enterprise and Vertex AI Agent Runtime
name: projects/wortz-project-352116/locations/us-central1/agentGateways/ge-private-egress-gateway
description: "Centralized Agent Gateway for Private BYO-MCP and A2A Workloads"
protocols:
  - MCP
networkConfig:
  egress:
    agentConnectivityTemplate: projects/wortz-project-352116/locations/us-central1/agentConnectivityTemplates/ge-psc-egress-template
googleManaged:
  governedAccessPath: AGENT_TO_ANYWHERE
registryBindings:
  - projects/wortz-project-352116/locations/us-central1
governedResources:
  - "//discoveryengine.googleapis.com/projects/wortz-project-352116/locations/global/collections/default_collection/engines/enterprise-search-app"
  - "//aiplatform.googleapis.com/projects/wortz-project-352116/locations/us-central1/reasoningEngines/1234567890"
selfManaged:
  resourceUri: projects/wortz-project-352116/regions/us-central1/subnetworks/enterprise-app-subnet
